[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_analytics"]

[project]
name = "fantasy-football-analytics"
version = "0.1.0"
description = "A learning project for NFL player statistics and fantasy football predictions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "nflreadpy>=0.1.5",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
